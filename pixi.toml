[workspace]
name = "dyscolab-skills"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
pytest = "*"
matplotlib = "*"
networkx = "*"
pyyaml = "*"

# The library versions documented by the skill on this branch.
[pypi-dependencies]
poincare = "==1.2.0"
simbio = { version = "==1.2.0", extras = ["io"] }
jablonski = "==0.4.0"
rebop = "*"

[tasks]
test = "pytest tests"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["py314"]
py312 = ["py312"]
py313 = ["py313"]
